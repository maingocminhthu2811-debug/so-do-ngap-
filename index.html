    let map = null;
    let markersLayer = null;
    const markersMap = new Map();

    function ensureLeafletLoaded(onReady) {
      if (typeof L !== 'undefined' && typeof L.map === 'function') {
        onReady();
        return;
      }

      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
      script.onload = () => {
        if (typeof L !== 'undefined') onReady();
      };
      script.onerror = () => {
        const script2 = document.createElement('script');
        script2.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script2.onload = () => {
          if (typeof L !== 'undefined') onReady();
        };
        document.head.appendChild(script2);
      };
      document.head.appendChild(script);
    }

    function initMap() {
      renderSidebarList(floodPoints);
      updateFloatingLegend(floodPoints);
      setupFloatingLegendControls();

      ensureLeafletLoaded(() => {
        try {
          const mapEl = document.getElementById('map');
          if (!mapEl) return;

          if (map) {
            map.invalidateSize();
            return;
          }

          const defaultCenter = [10.8231, 106.6297];
          const defaultZoom = 11;

          // Giới hạn phạm vi hiển thị khu vực Miền Nam
          const mienNamBounds = L.latLngBounds(
            L.latLng(8.3, 104.0),  // Điểm cực Tây Nam (Cà Mau, Kiên Giang)
            L.latLng(12.3, 108.5)  // Điểm cực Đông Bắc (Bình Phước, Đồng Nai, Bà Rịa - Vũng Tàu)
          );

          map = L.map('map', {
            center: defaultCenter,
            zoom: defaultZoom,
            minZoom: 9,              // Giới hạn thu nhỏ: không thể thu nhỏ ra ngoài khu vực
            maxZoom: 18,             // Giới hạn phóng to: tối đa mức đường phố
            maxBounds: mienNamBounds, // Khóa khu vực hiển thị, chỉ cho phép kéo trong Miền Nam
            maxBoundsViscosity: 1.0, // Cố định chặt, ngăn kéo lệch ra ngoài phạm vi
            zoomControl: true,
            scrollWheelZoom: true
          });

          if (map.attributionControl) {
            map.attributionControl.setPrefix('<a href="https://leafletjs.com" title="A JavaScript library for interactive maps" target="_blank">Leaflet</a>');
          }

          const osmTile = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            minZoom: 9,
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
          });

          osmTile.on('tileerror', (error) => {
            if (error.tile && error.coords) {
              const fallbackUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${error.coords.z}/${error.coords.y}/${error.coords.x}`;
              if (error.tile.src !== fallbackUrl) {
                error.tile.src = fallbackUrl;
              }
            }
          });

          osmTile.addTo(map);

          const loader = document.getElementById('map-initial-loader');
          osmTile.on('load', () => {
            if (loader) loader.style.display = 'none';
          });
          setTimeout(() => {
            if (loader) loader.style.display = 'none';
          }, 700);

          markersLayer = L.layerGroup().addTo(map);

          renderMarkers(floodPoints);

          setTimeout(() => { if (map) map.invalidateSize(); }, 150);
          setTimeout(() => { if (map) map.invalidateSize(); }, 500);
          setTimeout(() => { if (map) map.invalidateSize(); }, 1200);

          window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
          });

        } catch (err) {
          console.error('Lỗi khi khởi tạo bản đồ Leaflet:', err);
        }
      });
    }

    function updateFloatingLegend(currentFilteredPoints) {
      const container = document.getElementById('legend-items-container');
      const totalBadge = document.getElementById('legend-total-badge');
      if (!container) return;

      const total = currentFilteredPoints ? currentFilteredPoints.length : 0;
      if (totalBadge) {
        totalBadge.textContent = `${total}`;
      }

      if (total === 0) {
        container.innerHTML = `
          <div class="py-2.5 text-[11px] text-slate-400 text-center italic">
            Không có điểm nào theo bộ lọc
          </div>
        `;
        return;
      }

      const categoryDefs = [
        {
          id: 'severe',
          name: 'Ngập thường xuyên / nặng',
          sublabel: 'Lượng mưa 30-50mm, triều < 1m',
          colorClass: 'bg-rose-500',
          badgeClass: 'text-rose-700 bg-rose-50 border-rose-200',
          pulseClass: 'pulse-severe',
          test: p => p.severity === 'severe'
        },
        {
          id: 'moderate',
          name: 'Ngập vừa',
          sublabel: 'Sâu 10-15cm, rút < 30p',
          colorClass: 'bg-amber-500',
          badgeClass: 'text-amber-800 bg-amber-50 border-amber-200',
          pulseClass: 'pulse-moderate',
          test: p => p.severity === 'moderate'
        },
        {
          id: 'light',
          name: 'Ngập nhẹ',
          sublabel: 'Sâu < 10cm, rút < 30p',
          colorClass: 'bg-yellow-400',
          badgeClass: 'text-yellow-800 bg-yellow-50 border-yellow-200',
          pulseClass: '',
          test: p => p.severity === 'light'
        },
        {
          id: 'tide',
          name: 'Ngập do triều',
          sublabel: 'Ảnh hưởng triều cường',
          colorClass: 'bg-blue-500',
          badgeClass: 'text-blue-700 bg-blue-50 border-blue-200',
          pulseClass: '',
          test: p => p.cause === 'tide'
        },
        {
          id: 'rain-tide',
          name: 'Ngập do mưa và triều',
          sublabel: 'Kết hợp mưa và triều',
          colorClass: 'bg-indigo-500',
          badgeClass: 'text-indigo-700 bg-indigo-50 border-indigo-200',
          pulseClass: '',
          test: p => p.cause === 'rain-tide'
        }
      ];

      const activeCategories = categoryDefs.map(cat => {
        const count = currentFilteredPoints.filter(cat.test).length;
        return { ...cat, count };
      }).filter(cat => cat.count > 0);

      if (activeCategories.length === 0) {
        container.innerHTML = `
          <div class="py-2 text-[11px] text-slate-400 text-center italic">
            Không có phân loại tương ứng
          </div>
        `;
        return;
      }

      container.innerHTML = activeCategories.map(cat => {
        return `
          <div class="flex items-center justify-between gap-2 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
            <div class="flex items-center gap-2 min-w-0">
              <div class="relative flex items-center justify-center w-3 h-3 shrink-0">
                ${cat.pulseClass ? `<span class="absolute -inset-1 rounded-full ${cat.colorClass} opacity-70 ${cat.pulseClass}"></span>` : ''}
                <span class="relative w-2.5 h-2.5 rounded-full ${cat.colorClass}"></span>
              </div>
              <div class="min-w-0">
                <div class="text-[11px] font-semibold text-slate-800 truncate leading-tight">${cat.name}</div>
                <div class="text-[10px] text-slate-500 leading-tight">${cat.sublabel}</div>
              </div>
            </div>
            <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded border ${cat.badgeClass} shrink-0 tabular-nums">
              ${cat.count}
            </span>
          </div>
        `;
      }).join('');
    }

    function setupFloatingLegendControls() {
      const legendEl = document.getElementById('floating-map-legend');
      const toggleBtn = document.getElementById('toggle-legend-btn');
      const icon = document.getElementById('legend-toggle-icon');
      const itemsContainer = document.getElementById('legend-items-container');

      if (!legendEl) return;

      if (typeof L !== 'undefined' && L.DomEvent) {
        L.DomEvent.disableClickPropagation(legendEl);
        L.DomEvent.disableScrollPropagation(legendEl);
      }

      let isCollapsed = false;
      if (toggleBtn && itemsContainer && icon) {
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          isCollapsed = !isCollapsed;
          if (isCollapsed) {
            itemsContainer.classList.add('hidden');
            icon.classList.add('rotate-180');
          } else {
            itemsContainer.classList.remove('hidden');
            icon.classList.remove('rotate-180');
          }
        });
      }
    }

    function createMarkerIcon(point) {
      let color = '#dc2626';
      let bgPulse = '';

      if (point.severity === 'severe') {
        color = '#dc2626';
        bgPulse = '<span class="absolute -inset-1 rounded-full bg-rose-500 opacity-75 pulse-severe"></span>';
      } else if (point.severity === 'moderate') {
        color = '#ea580c';
        bgPulse = '<span class="absolute -inset-1 rounded-full bg-amber-500 opacity-60 pulse-moderate"></span>';
      } else if (point.severity === 'light') {
        color = '#ca8a04';
      } else if (point.cause === 'tide') {
        color = '#2563eb';
      }

      const html = `
        <div class="relative flex items-center justify-center w-7 h-7 cursor-pointer group">
          ${bgPulse}
          <div class="relative w-6 h-6 rounded-full border-2 border-white flex items-center justify-center shadow-lg transition-transform group-hover:scale-125" style="background-color: ${color}">
            <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547" />
            </svg>
          </div>
        </div>
      `;

      return L.divIcon({
        html: html,
        className: 'custom-flood-marker',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function renderMarkers(points) {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      markersMap.clear();

      points.forEach(point => {
        const marker = L.marker([point.lat, point.lng], {
          icon: createMarkerIcon(point),
          title: point.street
        });

        const streetName = point.street ? (point.street.charAt(0).toUpperCase() + point.street.slice(1)) : '';

        const popupContent = `
          <div class="p-1 min-w-[210px]">
            <div class="flex items-center justify-between gap-2 pb-2 mb-2 border-b border-slate-100">
              <span class="text-[10px] font-bold uppercase tracking-wider text-sky-600">${point.regionName}</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">#${point.id}</span>
            </div>
            <h4 class="font-bold text-slate-900 text-sm mb-1 first-letter:uppercase">${streetName}</h4>
            <div class="text-xs text-slate-600 mb-2">${point.ward}</div>
            
            <div class="space-y-1 text-[11px] pt-2 border-t border-slate-100">
              <div class="flex items-center justify-between">
                <span class="text-slate-500">Nguyên nhân:</span>
                <span class="font-semibold text-slate-800">${point.causeName}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-slate-500">Mức độ:</span>
                <span class="font-semibold text-slate-800">${point.severityName}</span>
              </div>
              <div class="text-[11px] text-slate-500 mt-1 italic">${point.note}</div>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
        markersMap.set(point.id, marker);
      });
    }

    function renderSidebarList(points) {
      const container = document.getElementById('map-point-list');
      const countLabel = document.getElementById('filtered-count-label');
      const badge = document.getElementById('filtered-badge');

      if (countLabel) countLabel.textContent = `Hiển thị ${points.length} / ${floodPoints.length} vị trí`;
      if (badge) badge.textContent = `${points.length}`;

      if (!container) return;

      if (points.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-400 text-xs">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Không tìm thấy điểm ngập nào phù hợp
          </div>
        `;
        return;
      }

      container.innerHTML = points.map(p => {
        const streetName = p.street ? (p.street.charAt(0).toUpperCase() + p.street.slice(1)) : '';

        return `
          <div 
            onclick="focusPoint(${p.id})"
            class="p-2.5 rounded-xl hover:bg-white hover:shadow-sm cursor-pointer transition-all border border-transparent hover:border-slate-200/80 group"
          >
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="mb-0.5">
                  <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider truncate">${p.ward}</span>
                </div>
                <h4 class="text-xs font-bold text-slate-800 group-hover:text-sky-600 transition-colors leading-snug first-letter:uppercase">${streetName}</h4>
                <div class="text-[10px] text-slate-500 mt-0.5">${p.causeName}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function focusPoint(id) {
      const p = floodPoints.find(item => item.id === id);
      if (p && map) {
        map.flyTo([p.lat, p.lng], 16, { duration: 1.2 });
        const marker = markersMap.get(id);
        if (marker) {
          setTimeout(() => {
            marker.openPopup();
          }, 600);
        }
      }
    }

    function focusRegion(regionKey) {
      if (!map) return;
      if (regionKey === 'hcm') {
        map.flyTo([10.7769, 106.6909], 13);
      } else if (regionKey === 'thuduc') {
        map.flyTo([10.8400, 106.7600], 13);
      } else if (regionKey === 'binhduong') {
        map.flyTo([11.0200, 106.6700], 12);
      } else if (regionKey === 'vungtau') {
        map.flyTo([10.4200, 107.1200], 11);
      }
    }

    function applyFilters() {
      const searchVal = document.getElementById('map-search-input').value.toLowerCase().trim();
      const regionVal = document.getElementById('filter-region').value;
      const causeVal = document.getElementById('filter-cause').value;

      const filtered = floodPoints.filter(p => {
        const matchSearch = !searchVal || 
          p.street.toLowerCase().includes(searchVal) || 
          p.ward.toLowerCase().includes(searchVal) ||
          p.regionName.toLowerCase().includes(searchVal);

        const matchRegion = regionVal === 'all' || p.region === regionVal;

        const matchCause = causeVal === 'all' || p.cause === causeVal;

        return matchSearch && matchRegion && matchCause;
      });

      renderMarkers(filtered);
      renderSidebarList(filtered);
      updateFloatingLegend(filtered);

      if (filtered.length > 0 && map) {
        const bounds = L.latLngBounds(filtered.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    const searchInput = document.getElementById('map-search-input');
    const regionSelect = document.getElementById('filter-region');
    const causeSelect = document.getElementById('filter-cause');
    const resetBtn = document.getElementById('reset-map-filter');

    if (searchInput) searchInput.addEventListener('input', applyFilters);
    if (regionSelect) regionSelect.addEventListener('change', applyFilters);
    if (causeSelect) causeSelect.addEventListener('change', applyFilters);

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        if (regionSelect) regionSelect.value = 'all';
        if (causeSelect) causeSelect.value = 'all';
        applyFilters();
      });
    }

    // HIỆU ỨNG MƯA TRÊN CANVAS
    function initRainCanvas() {
      const canvas = document.getElementById('rain-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const drops = [];
      const dropCount = Math.min(Math.floor(width / 25), 45);

      for (let i = 0; i < dropCount; i++) {
        drops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 16 + 8,
          speed: Math.random() * 5 + 6,
          opacity: Math.random() * 0.25 + 0.1
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 1.2;

        drops.forEach(d => {
          ctx.beginPath();
          ctx.globalAlpha = d.opacity;
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 2, d.y + d.length);
          ctx.stroke();

          d.y += d.speed;
          d.x -= 0.5;

          if (d.y > height) {
            d.y = -20;
            d.x = Math.random() * width;
          }
        });

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      initRainCanvas();
    });

  </script>
